name: CI/CD Pipeline - Product Application

# ==============================================================================
# TALLER EVALUATIVO: AUTOMATIZACION CI/CD (INGENIERIA DE SOFTWARE V - ICESI)
# ==============================================================================
# Instrucciones:
# Complete este archivo configurando los eventos y los 4 jobs descritos en la guia
# y en la presentacion de clase:
#
#   Job 1: test-backend  (Pruebas unitarias Spring Boot + Subir Artefacto JAR)
#   Job 2: test-frontend (Linting TypeScript + Compilacion Vite de la SPA)
#   Job 3: build-docker  (Construccion Multi-Stage con Docker Buildx de API y Web)
#   Job 4: smoke-test    (Levantamiento con Docker Compose + Prueba cURL al API)
# ==============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: VALIDACION Y PRUEBAS UNITARIAS BACKEND
  # ----------------------------------------------------------------------------
  # TODO: Configurar runner ubuntu-latest
  # TODO: actions/checkout@v4
  # TODO: actions/setup-java@v4 (Java 17, distribution: 'temurin', cache: 'maven')
  # TODO: Ejecutar `mvn clean package` en backend/
  # TODO: actions/upload-artifact@v4 (Subir backend/target/*.jar como 'backend-jar')
  test-backend:
    name: Backend Unit Tests & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit & controller tests
        working-directory: backend
        run: mvn clean test

      - name: Package JAR artifact
        working-directory: backend
        run: mvn package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ----------------------------------------------------------------------------
  # JOB 2: VALIDACION Y COMPILACION FRONTEND
  # ----------------------------------------------------------------------------
  # TODO: Configurar runner ubuntu-latest
  # TODO: actions/checkout@v4
  # TODO: actions/setup-node@v4 (Node 20, cache: 'npm')
  # TODO: Ejecutar `npm install`, `npm run lint` y `npm run build` en frontend/
  test-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint (TypeScript type-check)
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build
  # ----------------------------------------------------------------------------
  # JOB 3: CONSTRUCCION DE IMAGENES DOCKER (MULTI-STAGE)
  # ----------------------------------------------------------------------------
  # TODO: Declarar dependencias: needs: [test-backend, test-frontend]
  # TODO: docker/setup-buildx-action@v3
  # TODO: docker/build-push-action@v5 para backend (context: ./backend)
  # TODO: docker/build-push-action@v5 para frontend (context: ./frontend)
  build-docker:
    name: Build Multi-Stage Docker Images
    needs: [ test-backend, test-frontend ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: product-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: product-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # JOB 4: DESPLIEGUE LOCAL Y PRUEBA DE HUMO (SMOKE TEST)
  # ----------------------------------------------------------------------------
  # TODO: Declarar dependencias: needs: [build-docker]
  # TODO: Levantar stack con `docker compose up -d --build`
  # TODO: Esperar disponibilidad y validar con `curl http://localhost:8080/api/products` (HTTP 200)
  # TODO: Apagar contenedores con `docker compose down`
  smoke-test:
    name: Compose Up & Smoke Testing
    needs: [ build-docker ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for backend availability
        run: |
          echo "Esperando a que el backend esté disponible..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/api/products > /dev/null; then
              echo "Backend disponible."
              exit 0
            fi
            echo "Intento $i fallido, reintentando en 5s..."
            sleep 5
          done
          echo "El backend no respondió a tiempo."
          docker compose logs
          exit 1

      - name: Smoke test - GET /api/products
        run: |
          http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/products)
          echo "Código HTTP recibido: $http_code"
          if [ "$http_code" -ne 200 ]; then
            echo "Smoke test fallido: se esperaba HTTP 200"
            docker compose logs
            exit 1
          fi

      - name: Smoke test - Frontend availability
        run: |
          echo "Esperando a que el frontend esté disponible..."
          for i in $(seq 1 15); do
            http_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo "000")
            if [ "$http_code" = "200" ]; then
              echo "Frontend disponible (HTTP $http_code)."
              exit 0
            fi
            echo "Intento $i: HTTP $http_code, reintentando en 5s..."
            sleep 5
          done
          echo "Smoke test fallido: frontend no respondió con HTTP 200"
          docker compose logs
          exit 1



      - name: Tear down stack
        if: always()
        run: docker compose down
