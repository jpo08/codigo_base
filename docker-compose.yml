
services:
  backend:
    ## Configurar la imagen
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: product-api:latest
    container_name: product-api
    ports:
      - "8080:8080"
    networks:
      - product-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/products || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    ## Configurar la imagen
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: product-frontend:latest
    container_name: product-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - product-network

networks:
  product-network:
    driver: bridge
